<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>炸金花云记分</title>
    <!-- 全局错误捕捉: 防止白屏无提示 -->
    <script>
      window.addEventListener('error', function(event) {
        const root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          root.innerHTML = `
            <div style="color: #f87171; background: #2c0b0e; padding: 20px; font-family: monospace; height: 100vh; display: flex; flex-direction: column; justify-content: center; text-align: center;">
              <h2 style="font-size: 20px; margin-bottom: 10px;">⚠️ 应用启动失败</h2>
              <p style="color: #fca5a5;">${event.message}</p>
              <p style="font-size: 12px; color: #999; margin-top: 20px;">请检查控制台 (F12) 获取更多细节</p>
            </div>
          `;
        }
      });
    </script>
</head>
  <body class="bg-slate-950 text-gray-100">
    <div id="root"></div>
    <!-- 🟢 关键修复: 添加 JS 入口文件 -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
